<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light">
  <title>中文姓名字体实验室 · 郭韦翔</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Liu+Jian+Mao+Cao&amp;family=Long+Cang&amp;family=Ma+Shan+Zheng&amp;family=Noto+Sans+SC:wght@300;400;600;700&amp;family=Noto+Serif+SC:wght@300;400;600;700&amp;family=ZCOOL+KuaiLe&amp;family=ZCOOL+QingKe+HuangYou&amp;family=ZCOOL+XiaoWei&amp;family=Zhi+Mang+Xing&amp;display=swap&amp;text=%E9%83%AD%E9%9F%A6%E7%BF%94" rel="stylesheet">
  <style>
    :root {
      --ink: #17212b;
      --muted: #657080;
      --line: #dfe7eb;
      --soft: #f3f7f9;
      --accent: #1c607f;
      --selected-family: "Ma Shan Zheng";
      --selected-weight: 400;
      --sample-size: 39px;
      --sample-spacing: 0px;
    }
    * { box-sizing: border-box; }
    body { margin: 0; color: var(--ink); background: #f7fafb; font-family: Inter, "Segoe UI", "Microsoft YaHei", sans-serif; }
    button, input { font: inherit; }
    button { color: inherit; }
    .shell { width: min(1120px, calc(100% - 40px)); margin: 0 auto; padding: 48px 0 72px; }
    .intro h1 { margin: 0; font-family: Palatino, Georgia, serif; font-size: clamp(32px, 5vw, 50px); font-weight: 400; letter-spacing: -.025em; }
    .intro p { max-width: 760px; margin: 12px 0 0; color: var(--muted); line-height: 1.7; }

    .preview-panel { margin-top: 30px; padding: 32px; border: 1px solid var(--line); border-radius: 22px; background: #fff; box-shadow: 0 12px 40px rgb(24 69 88 / 7%); }
    .preview-label { margin: 0 0 17px; color: var(--accent); font-size: 12px; font-weight: 700; letter-spacing: .12em; text-transform: uppercase; }
    .homepage-name { display: flex; align-items: baseline; flex-wrap: wrap; gap: 12px; margin: 0; font-family: Palatino, Georgia, serif; font-size: 44px; font-weight: 400; line-height: 1.25; letter-spacing: -.025em; }
    .divider { color: #a9b1bc; font-size: 27px; }
    .live-name { font-family: var(--selected-family); font-size: var(--sample-size); font-weight: var(--selected-weight); letter-spacing: var(--sample-spacing); }
    .selection-line { display: flex; align-items: center; flex-wrap: wrap; gap: 8px 15px; margin-top: 20px; color: var(--muted); font-size: 14px; }
    .selection-line strong { color: var(--ink); }
    code { padding: 5px 8px; border-radius: 6px; color: #234f61; background: #edf4f6; font-family: ui-monospace, SFMono-Regular, Consolas, monospace; font-size: 12px; }

    .controls { display: grid; grid-template-columns: minmax(180px, 1fr) repeat(2, minmax(170px, .75fr)) auto; gap: 18px; align-items: end; margin-top: 24px; padding-top: 23px; border-top: 1px solid var(--line); }
    .control label { display: block; margin-bottom: 7px; color: var(--muted); font-size: 13px; }
    .control input[type="text"] { width: 100%; height: 40px; padding: 0 11px; border: 1px solid #cfdbe1; border-radius: 8px; color: var(--ink); background: #fff; }
    .control input[type="range"] { width: 100%; accent-color: var(--accent); }
    .range-value { color: var(--accent); font-variant-numeric: tabular-nums; }
    .utility-button { min-height: 40px; padding: 8px 14px; border: 1px solid #b9cbd4; border-radius: 8px; color: var(--accent); background: #fff; cursor: pointer; }
    .utility-button:hover { background: var(--soft); }

    .library { margin-top: 42px; }
    .library-heading { display: flex; align-items: end; justify-content: space-between; gap: 20px; margin-bottom: 17px; }
    .library-heading h2 { margin: 0; font-family: Palatino, Georgia, serif; font-size: 30px; font-weight: 400; }
    .library-heading span { color: var(--muted); font-size: 13px; }
    .font-group + .font-group { margin-top: 33px; }
    .font-group h3 { margin: 0 0 11px; color: var(--muted); font-size: 13px; font-weight: 650; letter-spacing: .08em; text-transform: uppercase; }
    .font-grid { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 13px; }
    .font-card { position: relative; min-height: 132px; padding: 18px; border: 1px solid var(--line); border-radius: 15px; text-align: left; background: #fff; cursor: pointer; transition: border-color .18s ease, box-shadow .18s ease, transform .18s ease; }
    .font-card:hover { transform: translateY(-2px); border-color: #a9c2ce; box-shadow: 0 8px 24px rgb(26 70 90 / 8%); }
    .font-card.is-selected { border-color: var(--accent); box-shadow: 0 0 0 2px rgb(28 96 127 / 12%); }
    .font-card.is-selected::after { position: absolute; top: 12px; right: 13px; display: grid; place-items: center; width: 21px; height: 21px; border-radius: 50%; color: white; background: var(--accent); content: "✓"; font-size: 13px; }
    .font-sample { display: block; margin-top: 10px; font-size: 35px; line-height: 1.2; }
    .font-meta { display: block; color: var(--muted); font-size: 12px; }
    .font-title { display: block; margin-top: 2px; font-size: 14px; font-weight: 650; }
    .notice { margin-top: 28px; padding: 15px 18px; border-left: 3px solid #b8ced8; color: var(--muted); background: #eef4f6; font-size: 13px; line-height: 1.65; }
    .back-link { display: inline-block; margin-top: 28px; color: var(--accent); text-decoration: none; }
    .back-link:hover { text-decoration: underline; }

    @media (max-width: 820px) {
      .font-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); }
      .controls { grid-template-columns: 1fr 1fr; }
      .control:first-child { grid-column: 1 / -1; }
    }
    @media (max-width: 520px) {
      .shell { width: calc(100% - 28px); padding-top: 28px; }
      .preview-panel { padding: 22px 18px; }
      .homepage-name { font-size: 35px; gap: 9px; }
      .divider { font-size: 22px; }
      .font-grid, .controls { grid-template-columns: 1fr; }
      .control:first-child { grid-column: auto; }
      .library-heading { display: block; }
      .library-heading span { display: block; margin-top: 6px; }
    }
  </style>
</head>
<body>
  <main class="shell">
    <header class="intro">
      <h1>中文姓名字体实验室</h1>
      <p>点击任意字体卡片，即可在正式主页的姓名排版中实时预览。调整字号和字距后，页面会自动记住你的选择。</p>
    </header>

    <section class="preview-panel" aria-labelledby="preview-title">
      <p class="preview-label" id="preview-title">Homepage preview</p>
      <p class="homepage-name">Weixiang Guo <span class="divider" aria-hidden="true">/</span> <span class="live-name" id="live-name">郭韦翔</span></p>
      <div class="selection-line">
        <span>当前选择：<strong id="selected-title">马善政毛笔字体</strong></span>
        <code id="css-output">font-family: "Ma Shan Zheng"; font-weight: 400;</code>
        <button class="utility-button" id="copy-button" type="button">复制 CSS</button>
      </div>
      <div class="controls">
        <div class="control">
          <label for="name-input">预览文字</label>
          <input id="name-input" type="text" value="郭韦翔" maxlength="8">
        </div>
        <div class="control">
          <label for="size-input">字号 <span class="range-value" id="size-value">39 px</span></label>
          <input id="size-input" type="range" min="28" max="60" value="39">
        </div>
        <div class="control">
          <label for="spacing-input">字距 <span class="range-value" id="spacing-value">0 px</span></label>
          <input id="spacing-input" type="range" min="-3" max="10" step="0.5" value="0">
        </div>
        <button class="utility-button" id="reset-button" type="button">恢复默认</button>
      </div>
    </section>

    <section class="library" aria-labelledby="library-title">
      <div class="library-heading">
        <h2 id="library-title">字体库</h2>
        <span id="font-count"></span>
      </div>
      <div id="font-library"></div>
      <p class="notice">“网页字体”在不同设备上效果一致；“系统字体”取决于当前电脑是否安装相应字体。正式主页建议优先选择网页字体。当前网页字体仅加载“郭韦翔”三个字，以保持预览页面轻量。</p>
      <a class="back-link" href="index.html">← 返回正式主页</a>
    </section>
  </main>

  <script>
    const fonts = [
      { group: "书法与手写", title: "马善政毛笔字体", family: "Ma Shan Zheng", weight: 400, note: "原模板字体" },
      { group: "书法与手写", title: "刘建毛草", family: "Liu Jian Mao Cao", weight: 400, note: "飘逸草书" },
      { group: "书法与手写", title: "龙藏体", family: "Long Cang", weight: 400, note: "自然行书" },
      { group: "书法与手写", title: "志莽行书", family: "Zhi Mang Xing", weight: 400, note: "强烈手写感" },
      { group: "创意展示", title: "站酷小薇体", family: "ZCOOL XiaoWei", weight: 400, note: "文艺衬线" },
      { group: "创意展示", title: "站酷快乐体", family: "ZCOOL KuaiLe", weight: 400, note: "活泼圆润" },
      { group: "创意展示", title: "站酷庆科黄油体", family: "ZCOOL QingKe HuangYou", weight: 400, note: "纤细现代" },
      { group: "现代宋体", title: "思源宋体 Light", family: "Noto Serif SC", weight: 300, note: "轻盈学术" },
      { group: "现代宋体", title: "思源宋体 Regular", family: "Noto Serif SC", weight: 400, note: "端正规范" },
      { group: "现代宋体", title: "思源宋体 SemiBold", family: "Noto Serif SC", weight: 600, note: "稳重醒目" },
      { group: "现代宋体", title: "思源宋体 Bold", family: "Noto Serif SC", weight: 700, note: "厚重标题" },
      { group: "现代黑体", title: "思源黑体 Light", family: "Noto Sans SC", weight: 300, note: "清爽极简" },
      { group: "现代黑体", title: "思源黑体 Regular", family: "Noto Sans SC", weight: 400, note: "现代中性" },
      { group: "现代黑体", title: "思源黑体 SemiBold", family: "Noto Sans SC", weight: 600, note: "清晰有力" },
      { group: "现代黑体", title: "思源黑体 Bold", family: "Noto Sans SC", weight: 700, note: "强烈标题" },
      { group: "系统字体", title: "系统楷体", family: "Kaiti SC, STKaiti, KaiTi", weight: 400, note: "传统正式" },
      { group: "系统字体", title: "系统仿宋", family: "FangSong, STFangsong, FZFaSong-Z02", weight: 400, note: "公文风格" },
      { group: "系统字体", title: "系统宋体", family: "Songti SC, STSong, SimSun", weight: 400, note: "经典学术" },
      { group: "系统字体", title: "苹方 / 微软雅黑", family: "PingFang SC, Microsoft YaHei", weight: 400, note: "简洁现代" },
      { group: "系统字体", title: "系统黑体", family: "Heiti SC, SimHei", weight: 400, note: "醒目直接" }
    ];

    const root = document.documentElement;
    const library = document.getElementById("font-library");
    const liveName = document.getElementById("live-name");
    const nameInput = document.getElementById("name-input");
    const sizeInput = document.getElementById("size-input");
    const spacingInput = document.getElementById("spacing-input");
    const selectedTitle = document.getElementById("selected-title");
    const cssOutput = document.getElementById("css-output");
    const copyButton = document.getElementById("copy-button");
    const storageKey = "weixiang-font-preview";
    let selectedIndex = 0;

    function cssFamily(family) {
      return family.includes(",") ? family : '"' + family + '"';
    }

    function renderLibrary() {
      const groups = [...new Set(fonts.map(font => font.group))];
      groups.forEach(group => {
        const section = document.createElement("section");
        section.className = "font-group";
        const heading = document.createElement("h3");
        heading.textContent = group;
        const grid = document.createElement("div");
        grid.className = "font-grid";
        fonts.forEach((font, index) => {
          if (font.group !== group) return;
          const button = document.createElement("button");
          button.className = "font-card";
          button.type = "button";
          button.dataset.index = index;
          button.innerHTML = '<span class="font-meta">' + font.note + '</span><span class="font-title">' + font.title + '</span><span class="font-sample">郭韦翔</span>';
          button.querySelector(".font-sample").style.fontFamily = font.family;
          button.querySelector(".font-sample").style.fontWeight = font.weight;
          button.addEventListener("click", () => selectFont(index));
          grid.appendChild(button);
        });
        section.append(heading, grid);
        library.appendChild(section);
      });
      document.getElementById("font-count").textContent = fonts.length + " 种字体与字重方案";
    }

    function selectFont(index, save = true) {
      selectedIndex = index;
      const font = fonts[index];
      root.style.setProperty("--selected-family", cssFamily(font.family));
      root.style.setProperty("--selected-weight", font.weight);
      selectedTitle.textContent = font.title;
      cssOutput.textContent = "font-family: " + cssFamily(font.family) + "; font-weight: " + font.weight + ";";
      document.querySelectorAll(".font-card").forEach(card => card.classList.toggle("is-selected", Number(card.dataset.index) === index));
      if (save) saveState();
    }

    function updateControls(save = true) {
      liveName.textContent = nameInput.value || "郭韦翔";
      root.style.setProperty("--sample-size", sizeInput.value + "px");
      root.style.setProperty("--sample-spacing", spacingInput.value + "px");
      document.getElementById("size-value").textContent = sizeInput.value + " px";
      document.getElementById("spacing-value").textContent = spacingInput.value + " px";
      if (save) saveState();
    }

    function saveState() {
      localStorage.setItem(storageKey, JSON.stringify({ index: selectedIndex, text: nameInput.value, size: sizeInput.value, spacing: spacingInput.value }));
    }

    function restoreState() {
      try {
        const state = JSON.parse(localStorage.getItem(storageKey));
        if (!state) return;
        nameInput.value = state.text || "郭韦翔";
        sizeInput.value = state.size || 39;
        spacingInput.value = state.spacing || 0;
        selectedIndex = Number.isInteger(state.index) && fonts[state.index] ? state.index : 0;
      } catch (_) {}
    }

    [nameInput, sizeInput, spacingInput].forEach(input => input.addEventListener("input", () => updateControls()));
    document.getElementById("reset-button").addEventListener("click", () => {
      nameInput.value = "郭韦翔";
      sizeInput.value = 39;
      spacingInput.value = 0;
      selectFont(0, false);
      updateControls();
    });
    copyButton.addEventListener("click", async () => {
      try {
        await navigator.clipboard.writeText(cssOutput.textContent);
        copyButton.textContent = "已复制";
        setTimeout(() => { copyButton.textContent = "复制 CSS"; }, 1300);
      } catch (_) {
        window.prompt("复制下面的 CSS：", cssOutput.textContent);
      }
    });

    renderLibrary();
    restoreState();
    selectFont(selectedIndex, false);
    updateControls(false);
  </script>
</body>
</html>
